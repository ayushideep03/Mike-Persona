<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mike Persona | HP Executive Communications Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ==========================================================================
   MIKE PERSONA - HP EXECUTIVE COMMUNICATIONS SUITE
   Enterprise B2B Design System: Calm, Intentional, High-Hierarchy & Whitespace
   Palette: #171321 (Dark Obsidian), #4C1D95 (Brand Dark), #7C3AED (Primary CTA)
   85-90% Neutral Canvas (White / #FAFAFA / #E4E4E7 / #18181B)
   ========================================================================== */
:root {
  /* Brand Accents (Strictly restrained ~10-15%) */
  --primary: #7C3AED;
  --primary-hover: #6D28D9;
  --primary-active: #5B21B6;
  --primary-dark: #4C1D95;
  --primary-subtle: #F5F3FF;
  --dark: #171321;
  --dark-surface: #1E1A2B;
  --dark-border: rgba(255, 255, 255, 0.08);

  /* Clean Neutral Canvas (85-90%) */
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --surface-2: #F4F4F5;
  --border: #E4E4E7;
  --border-subtle: #EEEEF0;

  /* Typography */
  --text: #18181B;
  --muted: #71717A;
  --heading: #18181B;

  /* Semantic Feedback */
  --success: #16A34A;
  --success-bg: #DCFCE7;
  --success-text: #15803D;
  --warning: #D97706;
  --warning-bg: #FEF3C7;
  --warning-text: #B45309;
  --danger: #DC2626;
  --danger-bg: #FEE2E2;
  --danger-text: #991B1B;

  /* Subtle AI Accent (Calm Lavender Tint) */
  --ai-bg: #FAF8FE;
  --ai-border: #EBE6F3;
  --ai-text: #6B21A8;

  /* Elevation (Minimal & Restrained) */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);

  /* Radius */
  --r-xs: 6px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 14px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

[data-theme="dark"] {
  --bg: #0D0C13;
  --surface: #151322;
  --surface-2: #1C192C;
  --border: #2B2640;
  --border-subtle: #211D33;

  --text: #F4F4F5;
  --muted: #A1A1AA;
  --heading: #FFFFFF;

  --primary: #8B5CF6;
  --primary-hover: #7C3AED;
  --primary-active: #6D28D9;
  --primary-dark: #6D28D9;
  --primary-subtle: #1F1836;

  --ai-bg: #1A162B;
  --ai-border: #2E284B;
  --ai-text: #C4B5FD;

  --success-bg: rgba(22, 163, 74, 0.15);
  --success-text: #4ADE80;
  --warning-bg: rgba(217, 119, 6, 0.15);
  --warning-text: #FBBF24;
  --danger-bg: rgba(220, 38, 38, 0.15);
  --danger-text: #F87171;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
}

/* ==========================================================================
   RESET & TYPOGRAPHY HIERARCHY
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  min-height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 {
  color: var(--heading);
  line-height: 1.25;
}
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
h3 { font-size: 16px; font-weight: 600; }
h4 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
button, input, textarea, select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: none;
}
:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* ==========================================================================
   APP SHELL LAYOUT (Sidebar ~248px, Full-width main panel, ~24-28px padding)
   ========================================================================== */
.app-shell {
  display: flex;
  min-height: 100vh;
  width: 100%;
  background: var(--bg);
}

/* Sidebar */
.sidebar {
  width: 248px;
  flex: 0 0 248px;
  background: var(--dark);
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  border-right: 1px solid var(--dark-border);
  z-index: 20;
  transition: transform 0.2s ease-in-out;
}
.sidebar-header {
  padding: 18px 16px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--dark-border);
}
.sidebar-logo-mark {
  width: 32px;
  height: 32px;
  border-radius: var(--r-sm);
  background: linear-gradient(135deg, #171321 0%, #4C1D95 55%, #7C3AED 100%);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 13px;
  color: #FFFFFF;
  border: 1px solid rgba(255, 255, 255, 0.15);
}
.sidebar-brand-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: #FFFFFF;
  text-transform: uppercase;
}
.sidebar-brand-badge {
  font-size: 11px;
  color: #A1A1AA;
}
.sidebar-nav {
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
  flex: 1;
}
.sidebar-category {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #71717A;
  padding: 12px 10px 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--r-sm);
  color: #A1A1AA;
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  transition: all 0.15s ease;
  width: 100%;
}
.nav-item:hover {
  color: #FFFFFF;
  background: rgba(255, 255, 255, 0.05);
}
.nav-item.active {
  color: #FFFFFF;
  background: rgba(124, 58, 237, 0.18);
  font-weight: 600;
  box-shadow: inset 3px 0 0 #7C3AED;
}
.nav-item svg {
  width: 16px;
  height: 16px;
  flex: none;
  stroke-width: 1.8;
}
.sidebar-footer {
  padding: 12px 14px;
  border-top: 1px solid var(--dark-border);
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: rgba(0, 0, 0, 0.12);
}
.persona-user-card {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, 0.04);
}
.persona-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #7C3AED;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  color: #FFFFFF;
  flex: none;
}
.persona-user-name {
  font-size: 12px;
  font-weight: 600;
  color: #FFFFFF;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.persona-user-role {
  font-size: 10.5px;
  color: #71717A;
}
.sidebar-actions-row {
  display: flex;
  gap: 6px;
}
.sidebar-btn-sm {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  color: #A1A1AA;
  background: rgba(255, 255, 255, 0.06);
  border-radius: var(--r-xs);
  padding: 5px 8px;
}
.sidebar-btn-sm:hover {
  color: #FFFFFF;
  background: rgba(255, 255, 255, 0.12);
}

/* Main Panel */
.main-panel {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  width: 100%;
}
.top-nav {
  height: 54px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.nav-breadcrumbs {
  font-size: 13.5px;
  color: var(--muted);
}
.nav-breadcrumbs b {
  color: var(--heading);
  font-weight: 600;
}
.top-nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mobile-menu-toggle {
  display: none;
  padding: 6px;
  border-radius: var(--r-xs);
  color: var(--text);
  border: 1px solid var(--border);
}

/* Content Canvas */
.main-content {
  padding: 24px 28px 64px;
  width: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* ==========================================================================
   BUTTONS
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 14px;
  font-size: 13.5px;
  font-weight: 600;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.btn.primary {
  background: var(--primary);
  color: #FFFFFF;
}
.btn.primary:hover:not(:disabled) {
  background: var(--primary-hover);
}
.btn.secondary {
  background: var(--surface);
  border-color: var(--border);
  color: var(--text);
}
.btn.secondary:hover:not(:disabled) {
  background: var(--surface-2);
}
.btn.ghost {
  background: transparent;
  color: var(--muted);
  padding: 4px 8px;
}
.btn.ghost:hover:not(:disabled) {
  color: var(--text);
  background: var(--surface-2);
}
.btn.sm {
  padding: 5px 10px;
  font-size: 12.5px;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.link {
  color: var(--primary);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
}

/* ==========================================================================
   ORIENTATION BANNERS (Where am I? What am I deciding? What happens next?)
   ========================================================================== */
.step-banner {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-sm);
  flex-wrap: wrap;
}
.step-banner-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.step-tag-pill {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #FFFFFF;
  background: var(--primary);
  padding: 3px 8px;
  border-radius: var(--r-xs);
}
.step-banner-text {
  font-size: 13px;
  color: var(--muted);
}
.step-banner-text b {
  color: var(--heading);
}

/* ==========================================================================
   EXECUTIVE HEADER (Reduced ~25-30% height, Single Primary CTA)
   ========================================================================== */
.exec-header-compact {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-sm);
  flex-wrap: wrap;
}
.exec-header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}
.exec-avatar-compact {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #171321;
  display: grid;
  place-items: center;
  color: #FFFFFF;
  font-weight: 700;
  font-size: 15px;
  border: 2px solid var(--border);
  flex: none;
}
.exec-meta-compact h1 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 2px;
}
.exec-meta-compact .exec-sub {
  font-size: 12.5px;
  color: var(--muted);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.exec-header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.status-pill-secondary {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--success-text);
  background: var(--success-bg);
  padding: 3px 8px;
  border-radius: 999px;
}

/* ==========================================================================
   KPI SECTION (4 Primary Metrics)
   ========================================================================== */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}
.kpi-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.kpi-box .label {
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.kpi-box .value {
  font-size: 22px;
  font-weight: 700;
  color: var(--heading);
  line-height: 1.2;
  margin-top: 2px;
}
.kpi-box .hint {
  font-size: 11.5px;
  color: var(--muted);
}

/* ==========================================================================
   MAIN DASHBOARD 2-COLUMN SECTION (Whitespace & Progressive Disclosure)
   ========================================================================== */
.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}
.section-header-clean {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 12px;
}
.section-header-clean h3 {
  font-size: 16px;
  font-weight: 600;
}

/* Priority Account Cards (Concise, Uncluttered) */
.accounts-stack {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.account-card-clean {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  transition: border-color 0.15s ease;
}
.account-card-clean:hover {
  border-color: #D4D4D8;
}
.account-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.account-name-clean {
  font-size: 14px;
  font-weight: 600;
  color: var(--heading);
}
.account-geo-clean {
  font-size: 12px;
  color: var(--muted);
  margin-top: 1px;
}
.account-topic-clean {
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  background: var(--surface-2);
  padding: 3px 8px;
  border-radius: var(--r-xs);
  align-self: flex-start;
}
.badge-clean {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.badge-clean.ready {
  background: var(--success-bg);
  color: var(--success-text);
}
.badge-clean.researching {
  background: var(--warning-bg);
  color: var(--warning-text);
}
.badge-clean.neutral {
  background: var(--surface-2);
  color: var(--muted);
}

/* Executive Intelligence Box (Calm, Concise, Truncated with "View full") */
.intel-card-clean {
  background: var(--ai-bg);
  border: 1px solid var(--ai-border);
  border-radius: var(--r-md);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.intel-card-clean .intel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.intel-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ai-text);
}
.intel-list-concise {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.intel-row {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.intel-row-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--muted);
}
.intel-row-val {
  font-size: 13px;
  color: var(--heading);
  font-weight: 500;
}

/* Quick Topic Draft Box */
.quick-draft-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: var(--shadow-sm);
}

/* ==========================================================================
   SECONDARY WORKFLOW PROGRESS INDICATOR (Compact, Unobtrusive)
   ========================================================================== */
.compact-pipeline {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 12px;
  color: var(--muted);
  width: fit-content;
  overflow-x: auto;
}
.pipeline-step-mini {
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.pipeline-step-mini.done {
  color: var(--heading);
}
.pipeline-step-mini .chk {
  color: var(--success);
  font-weight: 700;
}
.pipeline-sep {
  color: #D4D4D8;
  font-size: 11px;
}

/* ==========================================================================
   TABLES (Clean, No Nested Outer Borders)
   ========================================================================== */
.table-wrap-clean {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow-x: auto;
  box-shadow: var(--shadow-sm);
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 600px;
  font-size: 13px;
}
th {
  background: var(--surface-2);
  color: var(--muted);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  text-align: left;
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
}
td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: middle;
}
tbody tr:last-child td {
  border-bottom: none;
}
tbody tr:hover {
  background: var(--surface-2);
}
.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-right: 6px;
}

/* ==========================================================================
   WORKFLOW SCREENS (Setup, Generating, Direction, Build, Check, Final)
   ========================================================================== */
.card-clean {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
}
.choice-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.choice-grid.two {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.choice-card-clean {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  transition: border-color 0.15s ease;
  position: relative;
  cursor: pointer;
}
.choice-card-clean:hover {
  border-color: #D4D4D8;
}
.choice-card-clean.selected {
  border: 2px solid var(--primary);
  background: var(--primary-subtle);
}
.choice-card-clean.selected::after {
  content: "Selected";
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--primary);
}
.choice-letter {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--primary);
  color: #FFFFFF;
  font-weight: 700;
  font-size: 12px;
  display: grid;
  place-items: center;
  margin-bottom: 2px;
}

/* Section Builder */
.section-item-clean {
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
}
.section-item-clean.active {
  border: 1.5px solid var(--primary);
}
.section-item-clean.locked {
  background: var(--surface-2);
  border-style: dashed;
  color: var(--muted);
}
.section-head-clean {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.section-title-clean {
  font-weight: 600;
  font-size: 13.5px;
  color: var(--heading);
}

/* Source Proof Badge */
.source-proof-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;

      '<input class="input" id="regenNote" placeholder="Note (e.g. emphasize teacher training)..." value="' + esc(S.regenNote) + '">' +

  return '<div class="section-item-clean active">' +
    '<div class="section-head-clean">' + titleHtml + ver + '</div>' +
    body +
    regenPanel +
  '</div>';
}

/* ==========================================================================
   RENDER PIPELINE
   ========================================================================= */
var app = document.getElementById("app");
var layer = document.getElementById("layer");

function render() {
  var v = S.view, h;
  if (v === "login") h = vLogin();
  else if (v === "home") h = vHome();
  else if (v === "setup") h = vSetup();
  else if (v === "generating") h = vGenerating(S.genMsg || "Synthesizing directions in Mike's voice");
  else if (v === "direction") h = vDirection();
  else if (v === "build") h = vBuild();
  else if (v === "check") h = vCheck();
  else if (v === "final") h = vFinal();
  app.innerHTML = h;
  renderLayer();
}

function renderLayer() {
  layer.innerHTML = (S.drawer ? vDrawer() : "") + (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + '</div>' : "");
}

function go(v) {
  S.view = v;
  S.error = "";
  S.mobileMenu = false;
  render();
  window.scrollTo(0, 0);
}

/* ==========================================================================
   AI ENGINE CALLS & BUSINESS LOGIC
   ========================================================================== */
function ask(prompt, opts) {
  if (!S.live || S.demo) return Promise.reject({ code: "demo" });
  ctl = new AbortController();
  var o = { signal: ctl.signal };
  for (var k in opts) o[k] = opts[k];
  return S.live.json(prompt, o);
}

function errCopy(e) {
  var c = e && e.code;
  if (c === "rate_limited") return "API rate limited. Please wait a moment.";
  if (c === "session_expired") return "Session expired. Please sign in again.";
  if (c === "invalid_json") return "Response returned in invalid JSON format.";
  return "Unable to complete request. Falling back to persona intelligence.";
}

function isHardOff(e) {
  var c = e && e.code;
  return c === "demo" || c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled" || c === "capability_removed";
}

function brief() {
  var b = "Account: " + (S.account ? S.account.name + " (" + S.account.sector + ")" : "General note") + "\nTopic: " + topicOf();
  if (S.note) b += "\nContext Note: " + S.note;
  return b;
}

function genDirections(more) {
  S.genMsg = more ? "Synthesizing alternative strategic directions..." : "Generating strategic directions in Mike's voice...";
  go("generating");
  var a = S.account;
  var prompt = PERSONA + "\n\nTASK: Propose two clearly different directions for one LinkedIn post by Mike.\n" + brief() +
    (more ? "\nRejected directions: " + S.directions.map(function (d) { return d.title; }).join("; ") + ". Reasons: " + (S.dirReason.join(", ") || "none") + (S.dirNote ? ". Note: " + S.dirNote : "") + ". Offer two new ones." : "") +
    '\nReply with only JSON: {"directions":[{"title":"3-6 word title","summary":"one sentence"},{"title":"...","summary":"..."}]}';

  ask(prompt, more ? { modelTier: "quick", cache: false } : { modelTier: "quick" }).then(function (r) {
    var d = r && r.directions;
    if (!d || d.length < 2) throw { code: "invalid_json" };
    S.directions = d.slice(0, 2).map(function (x) { return { title: String(x.title || "Direction"), summary: String(x.summary || "") }; });
    S.dir = 0; S.dirMore = !!more; S.showDirPanel = false; go("direction");
  }, function (e) {
    if (e && e.code === "cancelled") { go(more ? "direction" : "setup"); return; }
    if (isHardOff(e)) {
      S.demo = true;
      S.directions = demoDirections(a, more);
      S.dir = 0; S.dirMore = !!more; S.showDirPanel = false;
      go("direction");
      return;
    }
    S.error = errCopy(e);
    S.retry = function () { genDirections(more); };
    render();
  });
}

function genPost() {
  S.genMsg = "Drafting post in Mike's voice, section by section...";
  go("generating");
  var L = LENGTHS[S.length], keys = L.keys, d = S.directions[S.dir];
  var prompt = PERSONA + "\n\nTASK: Write one LinkedIn post as Mike.\n" + brief() + "\nPost type: " + L.label + ". Direction: " + d.title + ". " + d.summary +
    "\nLength: " + L.min + " to " + L.max + " words. Stay inside this range." +
    "\nWrite these sections in order:\n" +
    keys.map(function (k) { return "- " + k + " (" + SECTION_NAMES[k] + "): " + SECTION_GUIDE[k]; }).join("\n") +
    (S.link ? "\nA link will be added automatically." : "") +
    "\nSuggest 1 or 2 relevant hashtags." +
    '\nReply with only JSON: {"sections":[{"key":"' + keys[0] + '","text":"...","source":"..."}],"hashtags":["#..."]}';

  ask(prompt, {}).then(function (r) {
    var arr = r && r.sections;
    if (!arr || !arr.length) throw { code: "invalid_json" };
    S.tags = (r.hashtags || []).map(String).filter(function (h) { return /^#\w+$/.test(h); }).slice(0, 2);
    buildSections(function (k, i) {
      var m = arr.filter(function (x) { return x.key === k; })[0] || arr[i] || {};
      return { text: String(m.text || "").trim() || demoSection(k, ctxObj()).text, source: String(m.source || "Voice profile") };
    });
  }, function (e) {
    if (e && e.code === "cancelled") { go("direction"); return; }
    if (isHardOff(e)) {
      S.demo = true;
      S.tags = S.account ? [S.account.tag] : [];
      buildSections(function (k) { return demoSection(k, ctxObj()); });
      return;
    }
    S.error = errCopy(e);
    S.retry = genPost;
    render();
  });
}

function buildSections(fn) {
  S.sections = LENGTHS[S.length].keys.map(function (k, i) {
    return { key: k, name: SECTION_NAMES[k], versions: [fn(k, i)], v: 0, approved: false };
  });
  S.current = 0; S.editing = -1; S.regenOpen = -1; S.warnLater = false; S.useTags = false;
  go("build");
}

function regenSection(i) {
  var s = S.sections[i], reasons = S.regenReasons.slice(), note = S.regenNote;
  s.loading = true; S.regenOpen = -1; S.error = ""; render();

  var done = function (v) {
    s.loading = false;
    s.versions.push(v);
    s.v = s.versions.length - 1;
    S.regenReasons = [];
    S.regenNote = "";
    render();
  };

  var others = S.sections.map(function (x, j) { return (j === i ? ">> " : "") + x.name + ": " + cur(x).text; }).join("\n");
  var prompt = PERSONA + "\n\nTASK: Rewrite ONE section of Mike's LinkedIn post.\n" + brief() + "\nDirection: " + S.directions[S.dir].title +
    "\nContext:\n" + others +
    "\nRewrite section '" + s.name + "'. Feedback: " + (reasons.join(", ") || "improve") + (note ? ". Note: " + note : "") +
    ". Stay within target word range." +
    '\nReply with only JSON: {"text":"...","source":"..."}';

  ask(prompt, { cache: false }).then(function (r) {
    if (!r || !r.text) throw { code: "invalid_json" };
    done({ text: String(r.text).trim(), source: String(r.source || cur(s).source) });
  }, function (e) {
    if (e && e.code === "cancelled") { s.loading = false; render(); return; }
    if (isHardOff(e)) {
      var alt = demoSection(s.key, ctxObj(), s.versions.length % 2 === 1);
      done({ text: alt.text, source: alt.source });
      return;
    }
    s.loading = false; S.error = errCopy(e); render();
  });
}

function runChecks() {
  var flags = [], hasBad = false;
  S.sections.forEach(function (s, i) {
    var t = cur(s).text, m = t.match(/\[[^\]]+\]/g);
    if (m) m.forEach(function (p) {
      flags.push({ title: "Placeholder in " + s.name, detail: p + " requires HP confirmation.", sec: i });
    });
    var low = t.toLowerCase();
    OFF_LIMITS.forEach(function (w) {
      if (new RegExp("\\b" + w + "\\b").test(low)) {
        hasBad = true;
        flags.push({ title: "Off-limits word in " + s.name, detail: 'Mentions "' + w + '". Guardrail constraint violated.', sec: i, kind: "danger" });
      }
    });
  });
  if (!hasBad) {
    flags.push({ ok: true, title: "No off-limits topics detected", detail: "Checked against pricing, memory supply, earnings, and competitors." });
  }
  var wc = words(assembled()), L = LENGTHS[S.length];
  if (wc < L.min * 0.85 || wc > L.max * 1.15) {
    flags.push({ title: "Length variance from target format", detail: wc + " words; format target is " + rangeText(S.length) + ".", sec: null });
  } else {
    flags.push({ ok: true, title: "Word count matches post format", detail: wc + " words (Target: " + rangeText(S.length) + ")." });
  }
  S.flags = flags;
}

/* ==========================================================================
   EVENT DISPATCHER
   ========================================================================== */
document.addEventListener("submit", function (e) {
  var f = e.target.getAttribute("data-f");
  if (!f) return;
  e.preventDefault();
  if (f === "login") go("home");
  if (f === "note") {
    var v = document.getElementById("noteIn").value.trim();
    if (!v) { document.getElementById("noteIn").focus(); return; }
    S.account = null; S.note = v; S.fromNew = false; S.editNote = false; S.length = "pov"; S.link = "";
    go("setup");
  }
});

document.addEventListener("input", function (e) {
  var id = e.target.id;
  if (id === "dirNote") S.dirNote = e.target.value;
  if (id === "regenNote") S.regenNote = e.target.value;
  if (id === "noteNew" || id === "noteEdit") S.note = e.target.value;
  if (id === "linkIn") S.link = e.target.value.trim();
});

document.addEventListener("change", function (e) {
  if (e.target.id === "tagToggle") { S.useTags = e.target.checked; render(); return; }
  if (e.target.id === "accSel") {
    var id = e.target.value;
    S.account = ACCOUNTS.filter(function (a) { return a.id === id; })[0] || null;
    S.length = S.account ? S.account.suggest : "pov";
    render();
  }
});

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-a]");
  if (!el) return;
  var a = el.getAttribute("data-a"), i = +el.getAttribute("data-i");

  switch (a) {
    case "tab":
      S.tab = el.getAttribute("data-tab");
      S.mobileMenu = false;
      go("home");
      break;
    case "togglemenu":
      S.mobileMenu = !S.mobileMenu;
      render();
      break;
    case "theme":
      var nt = isDark() ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nt);
      store("mp-theme", nt);
      render();
      break;
    case "logout":
      S.drawer = null;
      go("login");
      break;
    case "home":
      if (S.view !== "login") {
        if (ctl) ctl.abort();
        go("home");
      }
      break;
    case "drawer":
      S.drawer = el.getAttribute("data-d");
      renderLayer();
      break;
    case "closedrawer":
      S.drawer = null;
      renderLayer();
      break;
    case "new":
      S.account = null;
      S.note = "";
      S.fromNew = true;
      S.length = "pov";
      S.link = "";
      go("setup");
      break;
    case "acc":
      S.account = ACCOUNTS.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      S.note = "";
      S.fromNew = false;
      S.length = S.account.suggest;
      S.link = "";
      go("setup");
      break;
    case "editnote":
      S.editNote = !S.editNote;
      render();
      break;
    case "len":
      S.length = el.getAttribute("data-k");
      render();
      break;
    case "continue":
      if (!S.account && !S.note.trim()) { toast("Please select an account or add context first"); break; }
      S.dirReason = [];
      S.dirNote = "";
      genDirections(false);
      break;
    case "stop":
      if (ctl) ctl.abort();
      break;
    case "retry":
      S.error = "";
      if (S.retry) S.retry();
      break;
    case "usedemo":
      S.demo = true;
      S.error = "";
      if (S.retry) S.retry();
      break;
    case "pickdir":
      S.dir = i;
      render();
      break;
    case "opendirpanel":
      S.showDirPanel = true;
      render();
      break;
    case "closedirpanel":
      S.showDirPanel = false;
      render();
      break;
    case "dirreason":
      var r = el.getAttribute("data-r"), k = S.dirReason.indexOf(r);
      if (k > -1) S.dirReason.splice(k, 1);
      else S.dirReason.push(r);
      render();
      break;
    case "moredirs":
      S.firstDirs = S.firstDirs || S.directions;
      genDirections(true);
      break;
    case "backdirs":
      if (S.firstDirs) {
        S.directions = S.firstDirs;
        S.dirMore = false;
        S.dir = 0;
        render();
      }
      break;
    case "usedir":
      if (!S.dirMore) S.firstDirs = S.directions;
      genPost();
      break;
    case "redirect":
      go("direction");
      break;
    case "approve":
      S.sections[i].approved = true;
      S.regenOpen = -1;
      S.editing = -1;
      S.current = S.sections.findIndex(function (s) { return !s.approved; });
      if (S.current < 0) S.current = S.sections.length;
      render();
      break;
    case "edit":
      S.editing = i;
      S.regenOpen = -1;
      render();
      var ta = document.getElementById("edit-" + i);
      if (ta) ta.focus();
      break;
    case "canceledit":
      S.editing = -1;
      render();
      break;
    case "saveedit":
      var t = document.getElementById("edit-" + i).value.trim();
      if (!t) { toast("Section content cannot be empty"); break; }
      var s = S.sections[i];
      s.versions.push({ text: t, source: cur(s).source + " (edited)" });
      s.v = s.versions.length - 1;
      if (s.approved && S.sections.slice(i + 1).some(function (x) { return x.approved; })) {
        S.warnLater = true;
      }
      S.editing = -1;
      render();
      break;
    case "regen":
      S.regenOpen = i;
      S.regenReasons = [];
      S.regenNote = "";
      render();
      break;
    case "closeregen":
      S.regenOpen = -1;
      render();
      break;
    case "rreason":
      var rr = el.getAttribute("data-r"), kk = S.regenReasons.indexOf(rr);
      if (kk > -1) S.regenReasons.splice(kk, 1);
      else S.regenReasons.push(rr);
      render();
      break;
    case "doregen":
      regenSection(i);
      break;
    case "vprev":
      S.sections[i].v = Math.max(0, S.sections[i].v - 1);
      render();
      break;
    case "vnext":
      S.sections[i].v = Math.min(S.sections[i].versions.length - 1, S.sections[i].v + 1);
      render();
      break;
    case "preview":
      runChecks();
      go("check");
      break;
    case "fix":
      var f = S.flags[i];
      if (f.sec != null) {
        var sx = S.sections[f.sec];
        sx.approved = false;
        S.current = f.sec;
        S.editing = f.sec;
      }
      go("build");
      break;
    case "keep":
      S.flags[i].keeping = true;
      render();
      break;
    case "cancelkeep":
      S.flags[i].keeping = false;
      render();
      break;
    case "savekeep":
      var why = document.getElementById("keep-" + i).value.trim();
      if (!why) { toast("Please record a reason to keep"); break; }
      S.flags[i].reason = why;
      S.flags[i].resolved = true;
      S.flags[i].keeping = false;
      render();
      break;
    case "unkeep":
      S.flags[i].resolved = false;
      render();
      break;
    case "markfinal":
      var text = finalText(), srcs = [];
      S.sections.forEach(function (s) {
        var x = (cur(s).source || "").replace(" (edited)", "");
        if (x && srcs.indexOf(x) < 0) srcs.push(x);
      });
      S.final = { text: text, sources: srcs, length: S.length };
      var d = new Date();
      history = history.filter(function (h) { return !h.example; });
      history.unshift({
        date: d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }),
        account: S.account ? S.account.short : "General Note",
        color: S.account ? S.account.color : "#7C3AED",
        topic: topicOf(),
        text: text,
        length: S.length,
        sources: srcs
      });
      history = history.slice(0, 30);
      store("mp-history-v2", history);
      go("final");
      break;
    case "copy":
      copyText(S.final.text);
      break;
    case "backbuild":
      go("build");
      break;
    case "startnew":
      go("home");
      break;
    case "hopen":
      var hItem = history[i];
      S.final = { text: hItem.text, sources: hItem.sources || [], length: hItem.length, fromHistory: true };
      go("final");
      break;
    case "hcopy":
      copyText(history[i].text);
      break;
  }
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    if (S.drawer) { S.drawer = null; renderLayer(); }
    if (S.mobileMenu) { S.mobileMenu = false; render(); }
  }
});

function copyText(t) {
  var ok = function () { toast("Copied post text to clipboard"); };
  try {
    navigator.clipboard.writeText(t).then(ok, function () { fallbackCopy(t); });
  } catch (e) {
    fallbackCopy(t);
  }
}

function fallbackCopy(t) {
  var ta = document.createElement("textarea");
  ta.value = t;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
    toast("Copied post text to clipboard");
  } catch (e) {
    toast("Please select and copy text");
  }
  document.body.removeChild(ta);
}

window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").addEventListener && window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

/* Initial Render */
render();
})();
</script>

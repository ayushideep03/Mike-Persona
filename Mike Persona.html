<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mike Persona | HP Executive Communications Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='4' fill='%230096D6'/><text x='12' y='16' fill='white' font-size='11' font-family='sans-serif' text-anchor='middle' font-weight='bold'>MP</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ==========================================================================
   MIKE PERSONA - HP EXECUTIVE COMMUNICATIONS STUDIO
   Enterprise Design System: Default Dark Mode, HP Blue & BridgeAI Brand Gradients
   Calm, Intentional, High-Hierarchy, Content-Writing Focus
   ========================================================================== */
:root {
  color-scheme: dark;

  /* HP Blue & Tech Accent System */
  --primary: #0096D6;               /* HP Signature Blue */
  --primary-hover: #0082BD;
  --primary-active: #006E9F;
  --primary-dark: #005A82;
  --primary-subtle: rgba(0, 150, 214, 0.14);
  --primary-glow: rgba(0, 150, 214, 0.25);
  --primary-gradient: linear-gradient(135deg, #0096D6 0%, #2563EB 100%);

  /* Default Deep Dark Canvas */
  --bg: #0B0F19;                    /* Obsidian Navy */
  --surface: #111827;               /* Slate 900 Surface */
  --surface-2: #1E293B;             /* Slate 800 Card Surface */
  --surface-3: #283548;             /* Slate 750 Interactive */
  --border: #243042;                /* Crisp Slate Border */
  --border-subtle: #1B2433;

  --dark: #070B14;
  --dark-surface: #0E1526;
  --dark-border: rgba(255, 255, 255, 0.08);

  /* Typography */
  --text: #F8FAFC;
  --muted: #94A3B8;
  --heading: #FFFFFF;

  /* AI Accent (Cyan / Electric Sky) */
  --ai-bg: #0C1E36;
  --ai-border: rgba(0, 150, 214, 0.32);
  --ai-text: #38BDF8;

  /* Semantic Feedback */
  --success: #10B981;
  --success-bg: rgba(16, 185, 129, 0.15);
  --success-text: #34D399;
  --warning: #F59E0B;
  --warning-bg: rgba(245, 158, 11, 0.15);
  --warning-text: #FBBF24;
  --danger: #EF4444;
  --danger-bg: rgba(239, 68, 68, 0.15);
  --danger-text: #F87171;

  /* Elevation */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 12px 28px -4px rgba(0, 0, 0, 0.65);

  /* Radius & Typography */
  --r-xs: 6px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 14px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

[data-theme="light"] {
  color-scheme: light;
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface-2: #F1F5F9;
  --surface-3: #E2E8F0;
  --border: #CBD5E1;
  --border-subtle: #E2E8F0;
  --dark: #0F172A;
  --dark-surface: #1E293B;
  --dark-border: rgba(0, 0, 0, 0.1);
  --text: #0F172A;
  --muted: #64748B;
  --heading: #0F172A;
  --primary: #0096D6;
  --primary-hover: #0082BD;
  --primary-subtle: rgba(0, 150, 214, 0.12);
  --ai-bg: #F0F9FF;
  --ai-border: #BAE6FD;
  --ai-text: #0284C7;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ==========================================================================
   APP SHELL LAYOUT (Sidebar ~248px with Smooth Collapsing, Full-Width Main Panel)
   ========================================================================== */
.app-shell {
  display: flex;
  min-height: 100vh;
  width: 100%;
  background: var(--bg);
}

/* Sidebar */
.sidebar {
  width: 248px;
  flex: 0 0 248px;
  background: var(--dark-surface);
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 40;
  transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1), transform 0.22s ease, opacity 0.22s ease;
  overflow: hidden;
}

.sidebar.collapsed {
  width: 0 !important;
  flex: 0 0 0 !important;
  border-right-width: 0 !important;
  opacity: 0;
  pointer-events: none;
}

.sidebar-header {
  padding: 18px 16px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}

.sidebar-logo-mark {
  width: 32px;
  height: 32px;
  border-radius: var(--r-sm);
  background: var(--primary-gradient);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 13px;
  color: #FFFFFF;
  box-shadow: 0 2px 6px rgba(0, 150, 214, 0.35);
  flex-shrink: 0;
}

.sidebar-brand-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #FFFFFF;
  white-space: nowrap;
}

.sidebar-brand-badge {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}

.sidebar-nav {
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow-y: auto;
  flex: 1;
}

.sidebar-category {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #64748B;
  padding: 12px 8px 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 500;
  color: #94A3B8;
  border-radius: var(--r-sm);
  background: transparent;
  border: none;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s ease;
  width: 100%;
  white-space: nowrap;
}

.nav-item:hover {
  color: #FFFFFF;
  background: rgba(255, 255, 255, 0.06);
}

.nav-item.active {
  color: #FFFFFF;
  background: var(--primary-subtle);
  border: 1px solid rgba(0, 150, 214, 0.4);
  font-weight: 600;
}

.nav-item svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  stroke-width: 1.8;
}

.sidebar-footer {
  padding: 12px 12px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: rgba(0, 0, 0, 0.2);
}

.persona-user-card {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 4px;
}

.persona-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #1E293B;
  border: 1px solid rgba(255, 255, 255, 0.15);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  color: #38BDF8;
  flex-shrink: 0;
}

.persona-user-name {
  font-size: 12px;
  font-weight: 600;
  color: #FFFFFF;
  line-height: 1.2;
}

.persona-user-role {
  font-size: 10.5px;
  color: #94A3B8;
}

.sidebar-actions-row {
  display: flex;
  gap: 6px;
}

.sidebar-btn-sm {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 11px;
  color: #94A3B8;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--r-xs);
  padding: 5px 8px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.sidebar-btn-sm:hover {
  color: #FFFFFF;
  background: rgba(255, 255, 255, 0.12);
}

/* Powered by BridgeAI Branding in Sidebar */
.bridge-symbol-img {
  height: 20px;
  width: auto;
  object-fit: contain;
  flex-shrink: 0;
  filter: drop-shadow(0 0 3px rgba(56, 189, 248, 0.3));
}

[data-theme="light"] .bridge-symbol-img {
  filter: brightness(0.18);
}

.sidebar-bridge-branding {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 8px;
  background: rgba(0, 150, 214, 0.06);
  border: 1px solid rgba(0, 150, 214, 0.2);
  border-radius: var(--r-xs);
  font-size: 10.5px;
  color: #94A3B8;
}

.sidebar-bridge-branding svg {
  color: #0096D6;
  flex-shrink: 0;
}

.sidebar-bridge-branding strong {
  color: #38BDF8;
  font-weight: 700;
  letter-spacing: 0.01em;
}

/* Main Panel */
.main-panel {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

/* Top Navigation Bar */
.top-nav {
  height: 52px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 30;
}

.nav-breadcrumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
}

.nav-breadcrumbs b {
  color: var(--heading);
  font-weight: 600;
}

.top-nav-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.status-pill-secondary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 9999px;
  font-size: 11px;
  color: var(--muted);
}

.status-pill-secondary::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 6px var(--primary);
}

/* Sidebar Toggle Circle near Active Voice 2.4 */
.sidebar-toggle-circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
}

.sidebar-toggle-circle:hover {
  background: var(--primary-subtle);
  border-color: var(--primary);
  color: var(--primary);
}

/* Main Content Area */
.main-content {
  flex: 1;
  padding: 24px 28px 48px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}

/* Responsive layout adjustments */
@media (max-width: 1024px) {
  .sidebar {
    position: fixed;
    transform: translateX(-100%);
    width: 250px;
  }
  .sidebar.mobile-open {
    transform: translateX(0);
    box-shadow: 0 0 24px rgba(0,0,0,0.6);
  }
  .main-content {
    padding: 16px;
  }
}

/* Typography & Headings */
h1 { font-size: 22px; font-weight: 700; color: var(--heading); letter-spacing: -0.015em; line-height: 1.25; }
h2 { font-size: 17px; font-weight: 600; color: var(--heading); letter-spacing: -0.01em; }
h3 { font-size: 14.5px; font-weight: 600; color: var(--heading); }
p { font-size: 13.5px; color: var(--text); line-height: 1.55; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s ease;
  line-height: 1.3;
  text-decoration: none;
  white-space: nowrap;
}

.btn.primary {
  background: var(--primary);
  background-image: var(--primary-gradient);
  color: #FFFFFF;
  box-shadow: 0 2px 8px rgba(0, 150, 214, 0.3);
}

.btn.primary:hover {
  filter: brightness(1.08);
  box-shadow: 0 4px 14px rgba(0, 150, 214, 0.45);
}

.btn.secondary {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border);
}

.btn.secondary:hover {
  background: var(--surface-3);
  border-color: var(--primary);
  color: #FFFFFF;
}

.btn.ghost {
  background: transparent;
  color: var(--muted);
}

.btn.ghost:hover {
  background: var(--surface-2);
  color: var(--text);
}

.btn.sm {
  padding: 5px 10px;
  font-size: 12px;
}

.btn svg {
  width: 15px;
  height: 15px;
  stroke-width: 1.8;
}

/* Cards & Surfaces */
.card-clean {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
}

.header-banner {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.hero-profile {
  display: flex;
  align-items: center;
  gap: 12px;
}

.hero-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1.5px solid var(--primary);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 15px;
  color: var(--primary);
  flex-shrink: 0;
  box-shadow: 0 0 12px rgba(0, 150, 214, 0.25);
}

.hero-meta-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--heading);
}

.hero-meta-subtitle {
  font-size: 12px;
  color: var(--muted);
}

/* Metric Cards */
.metrics-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

@media (max-width: 900px) {
  .metrics-row {
    grid-template-columns: repeat(2, 1fr);
  }
}

.metric-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.metric-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.metric-val {
  font-size: 22px;
  font-weight: 700;
  color: var(--heading);
  letter-spacing: -0.01em;
}

/* Content Creation Section: Partnership vs New Topic */
.creation-paths-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 18px;
}

@media (max-width: 1024px) {
  .creation-paths-grid {
    grid-template-columns: 1fr;
  }
}

.partnerships-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 12px;
}

@media (max-width: 700px) {
  .partnerships-grid {
    grid-template-columns: 1fr;
  }
}

.partnership-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  transition: all 0.15s ease;
}

.partnership-card:hover {
  border-color: var(--primary);
  background: var(--surface-3);
}

.partnership-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.partnership-name {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--heading);
}

.partnership-meta {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 2px;
}

.partnership-topic {
  font-size: 12px;
  color: #CBD5E1;
  background: rgba(0, 0, 0, 0.2);
  padding: 6px 8px;
  border-radius: var(--r-xs);
  border: 1px solid var(--border);
  line-height: 1.4;
}

.badge-clean {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 9999px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: inline-block;
  white-space: nowrap;
}

.badge-clean.ready {
  background: var(--success-bg);
  color: var(--success-text);
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.badge-clean.partner {
  background: rgba(0, 150, 214, 0.15);
  color: #38BDF8;
  border: 1px solid rgba(0, 150, 214, 0.3);
}

/* Prompt Box for New Topic */
.new-topic-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 14px;
}

.prompt-textarea {
  width: 100%;
  min-height: 90px;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  resize: vertical;
  line-height: 1.45;
}

.prompt-textarea:focus, select:focus, textarea:focus, input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-subtle);
}

/* Workflow Step Orientation Banner */
.step-banner {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 12.5px;
}

.step-phase {
  display: flex;
  align-items: center;
  gap: 8px;
}

.step-chip {
  background: var(--primary);
  color: #FFFFFF;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--r-xs);
}

/* Archetype Grid */
.archetype-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

@media (max-width: 800px) {
  .archetype-grid {
    grid-template-columns: 1fr;
  }
}

.choice-card-clean {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 12px;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s ease;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  color: var(--text);
}

.choice-card-clean:hover {
  border-color: var(--primary);
  background: var(--surface-3);
}

.choice-card-clean.selected {
  border-color: var(--primary);
  background: var(--primary-subtle);
  box-shadow: 0 0 0 1px var(--primary);
}

.choice-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: var(--r-xs);
  background: rgba(255, 255, 255, 0.1);
  font-size: 11px;
  font-weight: 700;
  color: var(--primary);
}

/* Table Design */
.table-container {
  overflow-x: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 600px;
  font-size: 13px;
}

th {
  background: var(--surface-2);
  color: var(--muted);
  font-weight: 600;
  padding: 10px 14px;
  text-align: left;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  border-bottom: 1px solid var(--border);
}

td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text);
  vertical-align: middle;
}

tr:hover td {
  background: rgba(255, 255, 255, 0.02);
}

/* LinkedIn Realistic Card */
.linkedin-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 22px;
  max-width: 720px;
  box-shadow: var(--shadow);
}

.linkedin-header {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 16px;
}

.linkedin-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #1E293B;
  border: 1.5px solid var(--primary);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 15px;
  color: #38BDF8;
}

.linkedin-post-body {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
  padding: 12px 0;
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
}

/* Drawer / Layer Modal */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  justify-content: flex-end;
}

.drawer-panel {
  background: var(--surface);
  width: 100%;

function vTopNav() {

  var curStep = STEP_MAP[S.view];

  var leftContent = '<div class="nav-breadcrumbs">';
  if (curStep) {
    leftContent += '<button class="btn ghost sm" data-a="home" style="padding: 2px 6px;">Studio</button> <span class="muted">/</span> <b>' + STEP_TITLES[curStep] + '</b>';
  } else {
    var tabNames = { overview: "Content Studio", history: "LinkedIn Post History" };
    leftContent += '<span class="muted">Mike Persona /</span> <b>' + (tabNames[S.tab] || "Studio") + '</b>';
  }
  leftContent += '</div>';

  var rightContent = '<div class="top-nav-actions">' +
    '<span class="status-pill-secondary">Active Voice v2.4</span>' +
    '<button class="sidebar-toggle-circle" data-a="togglesidebar" aria-label="Toggle sidebar" title="Toggle sidebar">' +
      '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 12h6M9 9l-3 3 3 3"/></svg>' +
    '</button>' +
  '</div>';

  return '<header class="top-nav">' + leftContent + rightContent + '</header>';
}

/* ==========================================================================
   STUDIO MAIN VIEW (Home / Dashboard)
   ========================================================================== */
function vHome() {
  if (S.tab === "history") return vHistoryView();

  /* 1. Partnership Cards */
  var partnerCards = ACCOUNTS.map(function(a) {
    return '<div class="partnership-card">' +
      '<div>' +
        '<div class="partnership-header">' +
          '<div>' +
            '<div class="partnership-name">' + esc(a.name) + '</div>' +
            '<div class="partnership-meta">' + esc(a.sector) + '</div>' +
          '</div>' +
          '<span class="badge-clean partner">HP Partner</span>' +
        '</div>' +
        '<div class="partnership-topic" style="margin-top: 8px;">' +
          '<b>Focus:</b> ' + esc(a.topic) +
        '</div>' +
        '<p class="small muted" style="margin-top: 6px; line-height: 1.4;">' + esc(a.summary) + '</p>' +
      '</div>' +
      '<button class="btn secondary sm" style="align-self: flex-start; margin-top: 4px;" data-a="acc" data-id="' + a.id + '">' +
        ICON.edit + '<span>Draft Post</span>' +
      '</button>' +
    '</div>';
  }).join("");

  /* 2. History Rows */
  var historyRows = postHistory.map(function(h, i) {
    var firstLine = (h.text.split("\n")[0] || "").slice(0, 85) + "...";
    return '<tr>' +
      '<td style="white-space: nowrap; font-size: 12px; color: var(--muted);">' + esc(h.date) + '</td>' +
      '<td><b>' + esc(h.account) + '</b></td>' +
      '<td><span class="badge-clean partner" style="font-size: 11px;">' + esc(h.format) + '</span></td>' +
      '<td style="max-width: 320px; font-size: 12.5px; color: var(--muted);">' + esc(firstLine) + '</td>' +
      '<td style="white-space: nowrap; text-align: right;">' +
        '<button class="btn ghost sm" data-a="hopen" data-i="' + i + '">Open</button> ' +
        '<button class="btn ghost sm" data-a="hcopy" data-i="' + i + '">' + ICON.copy + '<span>Copy</span></button>' +
      '</td>' +
    '</tr>';
  }).join("");

  return '<div class="app-shell">' +
    vSidebar() +
    '<div class="main-panel">' +
      vTopNav() +
      '<main class="main-content">' +
        /* Executive Header Banner */
        '<div class="header-banner">' +
          '<div class="hero-profile">' +
            '<div class="hero-avatar">MB</div>' +
            '<div>' +
              '<div class="hero-meta-title">Michael Boyle</div>' +
              '<div class="hero-meta-subtitle">SVP & Managing Director, HP Greater Asia • LinkedIn Communications Studio</div>' +
            '</div>' +
          '</div>' +
          '<div style="display: flex; gap: 8px; align-items: center;">' +
            '<button class="btn secondary" data-a="drawer" data-d="voice">' + ICON.voice + '<span>Voice Profile</span></button>' +
            '<button class="btn primary" data-a="new">' + ICON.edit + '<span>Draft as My Voice</span></button>' +
          '</div>' +
        '</div>' +

        /* Concise Metrics Row */
        '<div class="metrics-row">' +
          '<div class="metric-card">' +
            '<span class="metric-label">Key HP Partnerships</span>' +
            '<span class="metric-val">4</span>' +
          '</div>' +
          '<div class="metric-card">' +
            '<span class="metric-label">Approved LinkedIn Posts</span>' +
            '<span class="metric-val">' + postHistory.length + '</span>' +
          '</div>' +
          '<div class="metric-card">' +
            '<span class="metric-label">Voice Calibration</span>' +
            '<span class="metric-val" style="font-size: 16px; color: var(--primary);">Active v2.4</span>' +
          '</div>' +
          '<div class="metric-card">' +
            '<span class="metric-label">Knowledge Base</span>' +
            '<span class="metric-val" style="font-size: 16px; color: var(--success-text);">Verified</span>' +
          '</div>' +
        '</div>' +

        /* Unified Content Writing Flow */
        '<div class="creation-paths-grid">' +
          /* Option 1: Existing HP Partnerships */
          '<div class="card-clean">' +
            '<div style="display: flex; justify-content: space-between; align-items: baseline;">' +
              '<div>' +
                '<h2>Existing HP Partnerships</h2>' +
                '<p class="small muted">Write a LinkedIn post featuring an established HP client or government initiative.</p>' +
              '</div>' +
            '</div>' +
            '<div class="partnerships-grid">' + partnerCards + '</div>' +
          '</div>' +

          /* Option 2: Draft from a New Topic or Custom Prompt */
          '<div class="new-topic-card">' +
            '<div>' +
              '<h2>Draft from New Topic or Prompt</h2>' +
              '<p class="small muted" style="margin-top: 4px;">Write about a general executive insight, keynote takeaway, hybrid work culture, or custom topic.</p>' +
              '<div style="margin-top: 14px;">' +
                '<label class="small muted" style="font-weight: 600; display: block; margin-bottom: 6px;">Prompt / Topic Angle:</label>' +
                '<textarea class="prompt-textarea" id="homeQuickTopic" placeholder="e.g. Key takeaways from today\'s Singapore sustainability summit regarding circular packaging..."></textarea>' +
              '</div>' +
            '</div>' +
            '<button class="btn primary" style="width: 100%; justify-content: center; margin-top: 8px;" data-a="startprompt">' +
              ICON.sparkle + '<span>Draft from This Topic</span>' +
            '</button>' +
          '</div>' +
        '</div>' +

        /* Recent Posts Table */
        '<div class="card-clean">' +
          '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">' +
            '<div>' +
              '<h2>Recent LinkedIn Posts</h2>' +
              '<p class="small muted">Posts authored and approved in Mike\'s voice.</p>' +
            '</div>' +
            '<button class="btn secondary sm" data-a="tab" data-tab="history">View All</button>' +
          '</div>' +
          '<div class="table-container">' +
            '<table>' +
              '<thead>' +
                '<tr>' +
                  '<th>Date</th>' +
                  '<th>Partnership / Topic</th>' +
                  '<th>Format</th>' +
                  '<th>Opening Line</th>' +
                  '<th style="text-align: right;">Actions</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody>' + historyRows + '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
      '</main>' +
    '</div>' +
  '</div>';
}

        '</div>' +
        '<div class="card-clean">' +

      title: "The Evidence & Partner Proof",
      purpose: "Real-world collaborative impact",
      text: "Working alongside " + partner + ", our focus has been removing friction from daily workflows so individuals can focus on their core purpose.\n\nReal progress happens when technology fades quietly into the background and lets great teams do what they do best.",
      source: "Client Case Study & Official Release"
    },
    {
      title: "The Dialogue Invitation",
      purpose: "Thoughtful conversational closing",
      text: "Leadership in our region comes down to keeping things simple and building trust with the people who use these tools every day.\n\nI would welcome hearing how other leaders across Asia Pacific are balancing digital agility with team empowerment.",
      source: "Authentic Mike Boyle Voice Architecture"
    }
  ];

  S.final = S.sections.map(function(s) { return s.text; }).join("\n\n");
}

/* ==========================================================================
   EVENT HANDLERS
   ========================================================================== */
document.addEventListener("click", function(e) {
  var el = e.target.closest("[data-a]");
  if (!el) return;
  var a = el.getAttribute("data-a");

  switch(a) {
    case "login":
      go("home");
      break;

    case "logout":
      S.drawer = null;
      go("login");
      break;

    case "home":
      S.drawer = null;
      go("home");
      break;

    case "tab":
      S.tab = el.getAttribute("data-tab");
      S.mobileMenu = false;
      go("home");
      break;

    case "togglesidebar":
      // Circle button near Active Voice 2.4 toggles sidebar on both desktop and mobile
      S.sidebarCollapsed = !S.sidebarCollapsed;
      S.mobileMenu = !S.mobileMenu;
      render();
      break;

    case "theme":
      var curDark = isDark();
      var nextTheme = curDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nextTheme);
      store("mp-theme", nextTheme);
      render();
      break;

    case "drawer":
      S.drawer = el.getAttribute("data-d");
      renderLayer();
      break;

    case "closedrawer":
      S.drawer = null;
      renderLayer();
      break;

    case "new":
      S.account = null;
      S.note = "";
      S.fromNew = true;
      S.format = "pov";
      go("setup");
      break;

    case "acc":
      var aid = el.getAttribute("data-id");
      S.account = ACCOUNTS.filter(function(x) { return x.id === aid; })[0] || null;
      S.note = "";
      S.fromNew = false;
      S.format = "solution";
      go("setup");
      break;

    case "synthesize":
      if (S.fromNew) {
        var sel = document.getElementById("accSel");
        var txt = document.getElementById("noteNew");
        var aid = sel ? sel.value : "";
        S.account = aid ? ACCOUNTS.filter(function(x) { return x.id === aid; })[0] : null;
        S.note = txt ? txt.value.trim() : "";
      }
      go("generating");
      setTimeout(function() {
        generateDirections();
        go("direction");
      }, 900);
      break;

    case "startprompt":
      var ta = document.getElementById("homeQuickTopic");
      S.account = null;
      S.note = ta ? ta.value.trim() : "";
      S.fromNew = true;
      S.format = "pov";
      go("setup");
      break;

    case "pickfmt":
      S.format = el.getAttribute("data-fmt");
      render();
      break;

    case "pickdir":
      S.dir = +el.getAttribute("data-i");
      render();
      break;

    case "regendir":
      generateDirections();
      showToast("Generated new strategic angles in Mike\'s voice");
      render();
      break;

    case "usedir":
      generateSections();
      go("build");
      break;

    case "stepdir":
      go("direction");
      break;

    case "gocheck":
      // Read any updated section text from textareas
      var textareas = document.querySelectorAll("[data-sec-idx]");
      textareas.forEach(function(t) {
        var idx = +t.getAttribute("data-sec-idx");
        if (S.sections[idx]) S.sections[idx].text = t.value;
      });
      S.final = S.sections.map(function(s) { return s.text; }).join("\n\n");
      go("check");
      break;

    case "stepbuild":
      go("build");
      break;

    case "gofinal":
      var chk = document.getElementById("checkTags");
      S.useTags = chk ? chk.checked : false;
      go("final");
      break;

    case "copypost":
      var tags = S.useTags ? "\n\n#Leadership #SustainableTech" : "";
      var full = S.final + tags;
      navigator.clipboard.writeText(full).then(function() {
        showToast("✓ Post copied to clipboard");
      });
      break;

    case "savehistory":
      var postTags = S.useTags ? "\n\n#Leadership #SustainableTech" : "";
      var saved = S.final + postTags;
      postHistory.unshift({
        date: "Today",
        account: S.account ? S.account.name : "Executive Insight",
        topic: S.account ? S.account.topic : (S.note || "Modern Leadership"),
        format: S.format,
        text: saved
      });
      showToast("✓ Saved to Post History");
      S.tab = "history";
      go("home");
      break;

    case "hcopy":
      var hi = +el.getAttribute("data-i");
      if (postHistory[hi]) {
        navigator.clipboard.writeText(postHistory[hi].text).then(function() {
          showToast("✓ Post copied from history");
        });
      }
      break;

    case "hopen":
      var hi2 = +el.getAttribute("data-i");
      if (postHistory[hi2]) {
        S.final = postHistory[hi2].text;
        S.useTags = false;
        go("final");
      }
      break;
  }
});

document.addEventListener("submit", function(e) {
  if (e.target.id === "setupForm") {
    e.preventDefault();
    if (S.fromNew) {
      var sel = document.getElementById("accSel");
      var txt = document.getElementById("noteNew");
      var aid = sel ? sel.value : "";
      S.account = aid ? ACCOUNTS.filter(function(x) { return x.id === aid; })[0] : null;
      S.note = txt ? txt.value.trim() : "";
    }
    go("generating");
    setTimeout(function() {
      generateDirections();
      go("direction");
    }, 900);
  }
});

/* Initialize */
var savedTheme = load("mp-theme", "dark");
document.documentElement.setAttribute("data-theme", savedTheme);
render();
</script>
</body>
</html>

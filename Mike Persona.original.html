<style>
/* Layout: one working column (max 1080px) under a brand-gradient top bar; Home opens with a gradient hero, later steps carry a summary strip. */
:root {
  --bg: #F5F8FB; --surface: #FFFFFF; --surface-2: #F5F8FB; --raised: #FFFFFF;
  --border: #DCE5EF; --text: #1A2433; --muted: #5B6B80; --heading: #0A1E3C;
  --blue: #0096D6; --blue-deep: #0063A6; --navy: #0A1E3C; --cyan: #3FD0F5;
  --sky: #E8F6FD; --sel: #E8F6FD;
  --success: #1E9E6A; --warning: #F2A33A; --danger: #D64545;
  --success-bg: rgba(30,158,106,.12); --warning-bg: rgba(242,163,58,.18); --danger-bg: rgba(214,69,69,.12);
  --shadow: 0 8px 24px rgba(0,99,166,.10); --shadow-h: 0 14px 32px rgba(0,99,166,.18);
  --brand: linear-gradient(135deg, #0A1E3C 0%, #0063A6 60%, #0096D6 100%);
  --glow: linear-gradient(90deg, #0096D6, #3FD0F5);
  --post-bg: #FFFFFF; --post-text: #1A2433; --post-muted: #5B6B80;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm: 12px; --r-md: 16px; --r-lg: 20px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07111F; --surface: #0E1B2E; --surface-2: #0B1727; --raised: #15253D;
  --border: #22344F; --text: #E8EEF6; --muted: #93A4BA; --heading: #F1F5FB;
  --blue: #2AB0EA; --cyan: #5EDBF8; --sky: #12304A; --sel: rgba(42,176,234,.12);
  --success: #34C48B; --warning: #F5B556; --danger: #EF6A6A;
  --success-bg: rgba(52,196,139,.16); --warning-bg: rgba(245,181,86,.20); --danger-bg: rgba(239,106,106,.16);
  --shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); --shadow-h: 0 14px 32px rgba(0,0,0,.45);
  --glow: linear-gradient(90deg, #2AB0EA, #5EDBF8);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #07111F; --surface: #0E1B2E; --surface-2: #0B1727; --raised: #15253D;
  --border: #22344F; --text: #E8EEF6; --muted: #93A4BA; --heading: #F1F5FB;
  --blue: #2AB0EA; --cyan: #5EDBF8; --sky: #12304A; --sel: rgba(42,176,234,.12);
  --success: #34C48B; --warning: #F5B556; --danger: #EF6A6A;
  --success-bg: rgba(52,196,139,.16); --warning-bg: rgba(245,181,86,.20); --danger-bg: rgba(239,106,106,.16);
  --shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); --shadow-h: 0 14px 32px rgba(0,0,0,.45);
  --glow: linear-gradient(90deg, #2AB0EA, #5EDBF8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.6; transition: background .2s, color .2s; }
h1, h2, h3 { color: var(--heading); margin: 0; text-wrap: balance; line-height: 1.25; }
h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 700; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.label { font-size: 13px; font-weight: 500; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Top bar */
.top { background: var(--brand); color: #fff; padding-top: env(safe-area-inset-top, 0px); position: relative; }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--glow); }
.top-in { max-width: 1080px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: #fff; background: none; border: 0; padding: 0; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #8FE6FB; border: 1px solid rgba(143,230,251,.5); padding: 2px 8px; border-radius: 999px; }
.steps { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.step-dot { width: 22px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.25); }
.step-dot.done { background: #8FE6FB; }
.step-dot.now { width: 34px; background: linear-gradient(90deg, #3FD0F5, #fff); }
.step-text { font-size: 12px; color: rgba(255,255,255,.85); margin-left: 6px; }
.top-actions { display: flex; gap: 6px; align-items: center; }
.top-btn { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #fff; border-radius: 10px; padding: 6px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.top-btn:hover { background: rgba(255,255,255,.2); }
.top-btn svg { width: 16px; height: 16px; }

/* Page */
.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 64px; display: flex; flex-direction: column; gap: 28px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 20px; min-width: 0; }

/* Buttons */
.btn { border-radius: var(--r-sm); padding: 10px 18px; font-weight: 600; border: 1px solid var(--blue); background: var(--surface); color: var(--blue); transition: transform .15s ease-out, box-shadow .15s, opacity .15s; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn.primary { background: var(--glow); color: #04223A; border: 0; }
.btn.ghost { border: 0; background: transparent; padding: 6px 4px; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.wide { width: 100%; }
.link { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* Hero */
.hero { background: var(--brand); border-radius: var(--r-lg); padding: 28px; color: #fff; position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
.hero::before { content: ""; position: absolute; width: 380px; height: 380px; right: -120px; top: -160px; background: radial-gradient(circle, rgba(63,208,245,.35), transparent 65%); pointer-events: none; }
.hero h1 { color: #fff; }
.hero > * { position: relative; min-width: 0; }
.persona { display: flex; gap: 14px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: #0A1E3C; color: #fff; box-shadow: 0 0 0 3px #3FD0F5; flex: none; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.pill-glass { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; }
.pill-glass:hover { background: rgba(255,255,255,.22); }
.btn.on-hero { background: #fff; color: #0063A6; border: 0; padding: 14px 22px; font-size: 16px; }

/* Accounts */
.accounts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.accounts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.start { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
.start form textarea { flex: 1; min-height: 140px; }
.start .btn { align-self: flex-end; }
.badge { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--blue); background: var(--sel); border-radius: 999px; padding: 2px 8px; }
.choice .like { font-size: 12px; color: var(--muted); font-style: italic; }
.acc { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 0 0 18px; box-shadow: var(--shadow); transition: transform .18s ease-out, box-shadow .18s, border-color .18s; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
.acc::before { content: ""; display: block; height: 4px; background: var(--glow); }
.acc > * { margin: 0 18px; }
.acc:hover { transform: translateY(-4px); box-shadow: var(--shadow-h); border-color: var(--blue); }
.acc-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--sky); display: grid; place-items: center; color: var(--blue); margin-top: 14px; }
.acc-icon svg { width: 20px; height: 20px; }
.acc-name { font-weight: 600; color: var(--heading); line-height: 1.3; }

/* Note box */
.note { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 8px 8px 8px 20px; box-shadow: inset 0 1px 3px rgba(0,0,0,.06); }
.note input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 0; outline: none; }
.send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--glow); color: #04223A; display: grid; place-items: center; flex: none; }
.send svg { width: 20px; height: 20px; }

/* Table */
.table-wrap { overflow-x: auto; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; min-width: 640px; }
th, td { text-align: left; padding: 12px 16px; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); }
tbody tr:nth-child(even) { background: var(--surface-2); }
td.first { max-width: 320px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
.ex { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; margin-left: 6px; }

/* Summary strip + recorded card */
.strip { background: var(--sel); border: 1px solid var(--border); border-left: 4px solid var(--blue); border-radius: var(--r-sm); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
.strip b { color: var(--heading); }
.recorded { background: var(--sel); border-radius: var(--r-md); padding: 18px 20px; border-left: 4px solid var(--blue); display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.recorded > div { min-width: 0; }
select, textarea, .input { width: 100%; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); padding: 10px 12px; }
textarea { min-height: 110px; resize: vertical; line-height: 1.6; }

/* Choice cards */
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.choices.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice { text-align: left; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r-md); padding: 18px; display: flex; flex-direction: column; gap: 8px; transition: border-color .15s, background .15s, transform .15s; position: relative; }
.choice:hover { border-color: var(--blue); }
.choice.on { border: 2px solid var(--blue); background: var(--sel); }
.choice.on::after { content: "Selected"; position: absolute; top: 14px; right: 14px; font-size: 12px; font-weight: 600; color: var(--blue); }
.bars { display: flex; gap: 3px; align-items: flex-end; height: 18px; }
.bars i { width: 6px; border-radius: 2px; background: var(--border); }
.bars i.f { background: var(--blue); }
.letter { width: 36px; height: 36px; border-radius: 50%; background: var(--glow); color: #04223A; font-weight: 700; display: grid; place-items: center; }

/* Generating */
.gen { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 40px 16px; text-align: center; }
.ring { width: 54px; height: 54px; border-radius: 50%; background: conic-gradient(var(--blue), var(--cyan), transparent 70%); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel { width: 100%; max-width: 560px; height: 70px; border-radius: var(--r-md); border: 1px dashed var(--border); background: linear-gradient(90deg, var(--surface) 0%, var(--sky) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.6s ease-in-out infinite; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

/* Build */
.progress { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--glow); transition: width .3s ease-out; }
.sec { border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.sec.active { border: 2px solid var(--blue); box-shadow: var(--shadow-h); }
.sec.locked { background: var(--surface-2); border-style: dashed; color: var(--muted); }
.sec-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.sec-name { font-weight: 600; color: var(--heading); display: flex; gap: 8px; align-items: center; }
.sec.locked .sec-name { color: var(--muted); }
.sec-text { white-space: pre-wrap; }
.okpill { background: var(--success-bg); color: var(--success); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
.ver { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.ver button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); }
.ver button:disabled { opacity: .35; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.chip.on { background: var(--sel); border-color: var(--blue); color: var(--blue); font-weight: 600; }
.regen { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.notice { border-radius: var(--r-sm); padding: 10px 14px; font-size: 14px; background: var(--warning-bg); border-left: 4px solid var(--warning); }
.notice.info { background: var(--sel); border-left-color: var(--blue); }
.notice.err { background: var(--danger-bg); border-left-color: var(--danger); }
.ico { width: 16px; height: 16px; flex: none; }

/* Final check + post */
.two-col { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.flag { border-radius: var(--r-sm); border: 1px solid var(--border); border-left: 4px solid var(--warning); padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.flag.ok { border-left-color: var(--success); }
.flag.bad { border-left-color: var(--danger); }
.flag.done { opacity: .75; }
.wash { background: linear-gradient(180deg, var(--sky), var(--bg)); border-radius: var(--r-lg); padding: 28px 16px; display: flex; justify-content: center; }
.post { background: var(--post-bg); color: var(--post-text); border-radius: var(--r-md); box-shadow: 0 18px 40px rgba(10,30,60,.18); padding: 20px; width: 100%; max-width: 560px; border: 1px solid #E3EAF2; }
.post-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.post-head .avatar { width: 44px; height: 44px; box-shadow: none; font-size: 14px; }
.post-name { font-weight: 700; color: #0A1E3C; line-height: 1.2; }
.post-role { font-size: 13px; color: var(--post-muted); }
.post-body { white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
.post-body .ph { background: rgba(242,163,58,.22); border-radius: 4px; padding: 0 3px; }
.post-body .tag-h { color: #0A66C2; font-weight: 600; }
.src { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 3px 12px; font-size: 13px; background: var(--surface); }

/* Login */
.login { min-height: 100vh; background: var(--brand); display: grid; place-items: center; padding: 32px 16px; position: relative; overflow: hidden; }
.login::before { content: ""; position: absolute; width: 520px; height: 520px; right: -160px; top: -200px; background: radial-gradient(circle, rgba(63,208,245,.3), transparent 65%); }
.login-in { position: relative; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px; }
.login-card { background: var(--surface); border-radius: var(--r-md); padding: 28px; box-shadow: 0 24px 60px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.4); display: flex; flex-direction: column; gap: 14px; }
.login-title { color: #fff; font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.login .top-btn { position: absolute; top: 16px; right: 16px; z-index: 1; }

/* Drawer + toast */
.scrim { position: fixed; inset: 0; background: rgba(5,15,30,.45); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--raised); z-index: 21; display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,.25); }
.drawer-head { background: var(--brand); color: #fff; padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 18px; display: flex; justify-content: space-between; align-items: center; }
.drawer-head h2 { color: #fff; }
.drawer-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.drawer-body h3 { padding-bottom: 6px; border-bottom: 1px solid var(--sky); }
.drawer-body ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.res { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.res span:last-child { white-space: nowrap; font-size: 12px; font-weight: 600; }
.st-ok { color: var(--success); } .st-wait { color: var(--warning); }
.res b, .res a { color: var(--heading); font-weight: 600; }
.res a { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--blue); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--success); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 30; box-shadow: var(--shadow-h); }

@media (max-width: 860px) {
  .accounts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two-col { grid-template-columns: 1fr; }
  .start { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .accounts, .accounts.two, .choices, .choices.two { grid-template-columns: 1fr; }
  .steps .step-dot { display: none; }
  .hero { padding: 22px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

      '<h3>People</h3><ul><li>Never invents personal details about Mike, and never names his family</li><li>Names or tags people only when you give their names</li></ul>' +
      '<h3>Voice</h3><ul><li>No hype words, no emojis</li><li>Hashtags: none by default, at most 2</li><li>At most one exclamation mark, at the end</li></ul>' +
      '<h3>Process</h3><ul><li>Every section is approved by a person before the post is final</li><li>Final check flags placeholders, off-limits words and length</li><li>The app never posts to LinkedIn</li><li>Don\'t paste confidential HP information until HP confirms its rules for AI tools</li></ul>';
  }
  return '<div class="scrim" data-a="closedrawer"></div><aside class="drawer" role="dialog" aria-label="' + title + '"><div class="drawer-head"><h2>' + title + '</h2><button class="top-btn" data-a="closedrawer">Close</button></div><div class="drawer-body">' + body + '</div></aside>';
}

/* ---------- Render ---------- */
var app = document.getElementById("app"), layer = document.getElementById("layer");
function render() {
  var v = S.view, h;
  if (v === "login") h = vLogin();
  else if (v === "home") h = vHome();
  else if (v === "setup") h = vSetup();
  else if (v === "generating") h = vGenerating(S.genMsg || "Writing two directions in Mike's voice");
  else if (v === "direction") h = vDirection();
  else if (v === "build") h = vBuild();
  else if (v === "check") h = vCheck();
  else if (v === "final") h = vFinal();
  app.innerHTML = h;
  renderLayer();
}
function renderLayer() { layer.innerHTML = (S.drawer ? vDrawer() : "") + (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + '</div>' : ""); }
function go(v) { S.view = v; S.error = ""; render(); window.scrollTo(0, 0); }

/* ---------- AI calls ---------- */
function ask(prompt, opts) {
  if (!S.live || S.demo) return Promise.reject({ code: "demo" });
  ctl = new AbortController();
  var o = { signal: ctl.signal };
  for (var k in opts) o[k] = opts[k];
  return S.live.json(prompt, o);
}
function errCopy(e) {
  var c = e && e.code;
  if (c === "rate_limited") return "Claude is busy right now. Wait a moment, then try again.";
  if (c === "session_expired") return "Your session has expired. Sign in to Claude again, then try again.";
  if (c === "invalid_json") return "The answer came back in the wrong format. Try again.";
  if (c === "refused") return "Claude declined this request. Change the note or direction and try again.";
  return "Something went wrong while writing. Try again, or use demo content.";
}
function isHardOff(e) { var c = e && e.code; return c === "demo" || c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled" || c === "capability_removed"; }
function brief() {
  var b = "Account: " + (S.account ? S.account.name + " (" + S.account.sector + ")" : "none, the post starts from a note") + "\nTopic: " + topicOf();
  if (S.note) b += "\nNote from HP Comms: " + S.note;
  return b;
}

function genDirections(more) {
  S.genMsg = more ? "Writing two other directions" : "Writing two directions in Mike's voice";
  go("generating");
  var a = S.account;
  var prompt = PERSONA + "\n\nTASK: Propose two clearly different directions for one LinkedIn post by Mike.\n" + brief() +
    (more ? "\nThe reader rejected these directions: " + S.directions.map(function (d) { return d.title; }).join("; ") + ". Reasons: " + (S.dirReason.join(", ") || "none given") + (S.dirNote ? ". Note: " + S.dirNote : "") + ". Offer two new ones." : "") +
    '\nReply with only JSON: {"directions":[{"title":"3-6 word title","summary":"one sentence on how the post opens and what it focuses on"},{"title":"...","summary":"..."}]}';
  ask(prompt, more ? { modelTier: "quick", cache: false } : { modelTier: "quick" }).then(function (r) {
    var d = r && r.directions;
    if (!d || d.length < 2) throw { code: "invalid_json" };
    S.directions = d.slice(0, 2).map(function (x) { return { title: String(x.title || "Direction"), summary: String(x.summary || "") }; });
    S.dir = 0; S.dirMore = !!more; S.showDirPanel = false; go("direction");
  }, function (e) {
    if (e && e.code === "cancelled") { go(more ? "direction" : "setup"); return; }
    if (isHardOff(e)) { S.demo = true; S.directions = demoDirections(a, more); S.dir = 0; S.dirMore = !!more; S.showDirPanel = false; go("direction"); return; }
    S.error = errCopy(e); S.retry = function () { genDirections(more); }; render();
  });
}
function genPost() {
  S.genMsg = "Writing the post in Mike's voice, section by section";
  go("generating");
  var L = LENGTHS[S.length], keys = L.keys, d = S.directions[S.dir];
  var prompt = PERSONA + "\n\nTASK: Write one LinkedIn post as Mike.\n" + brief() + "\nPost type: " + L.label + " (" + L.desc + "). " + L.like + "." +
    "\nDirection: " + d.title + ". " + d.summary +
    "\nLength: " + L.min + " to " + L.max + " words in total. Stay inside this range." +
    "\nWrite these sections in this order, each one short paragraph:\n" +
    keys.map(function (k) { return "- " + k + " (" + SECTION_NAMES[k] + "): " + SECTION_GUIDE[k]; }).join("\n") +
    (S.link ? "\nA link will be added after the post automatically; do not write the link yourself." : "") +
    "\nAlso suggest 1 or 2 hashtags relevant to the programme or topic (the reviewer decides whether to use them)." +
    '\nFor each section, name the source it relies on: one of: ' + SRC_LABELS.map(function (x) { return '"' + x + '"'; }).join(", ") + '.' +
    '\nReply with only JSON: {"sections":[{"key":"' + keys[0] + '","text":"...","source":"..."}],"hashtags":["#..."]} with one object per section in order.';
  ask(prompt, {}).then(function (r) {
    var arr = r && r.sections;
    if (!arr || !arr.length) throw { code: "invalid_json" };
    S.tags = (r.hashtags || []).map(String).filter(function (h) { return /^#\w+$/.test(h); }).slice(0, 2);
    buildSections(function (k, i) {
      var m = arr.filter(function (x) { return x.key === k; })[0] || arr[i] || {};
      return { text: String(m.text || "").trim() || demoSection(k, ctxObj()).text, source: String(m.source || "Voice profile") };
    });
  }, function (e) {
    if (e && e.code === "cancelled") { go("direction"); return; }
    if (isHardOff(e)) { S.demo = true; S.tags = S.account ? [S.account.tag] : []; buildSections(function (k) { return demoSection(k, ctxObj()); }); return; }
    S.error = errCopy(e); S.retry = genPost; render();
  });
}
function buildSections(fn) {
  S.sections = LENGTHS[S.length].keys.map(function (k, i) { return { key: k, name: SECTION_NAMES[k], versions: [fn(k, i)], v: 0, approved: false }; });
  S.current = 0; S.editing = -1; S.regenOpen = -1; S.warnLater = false; S.useTags = false; go("build");
}
function regenSection(i) {
  var s = S.sections[i], reasons = S.regenReasons.slice(), note = S.regenNote;
  s.loading = true; S.regenOpen = -1; S.error = ""; render();
  var done = function (v) { s.loading = false; s.versions.push(v); s.v = s.versions.length - 1; S.regenReasons = []; S.regenNote = ""; render(); };
  var others = S.sections.map(function (x, j) { return (j === i ? ">> " : "") + x.name + ": " + cur(x).text; }).join("\n");
  var prompt = PERSONA + "\n\nTASK: Rewrite ONE section of Mike's LinkedIn post.\n" + brief() + "\nDirection: " + S.directions[S.dir].title +
    "\nThe full post so far (the section to rewrite is marked >>):\n" + others +
    "\n\nRewrite only the section '" + s.name + "' (" + SECTION_GUIDE[s.key] + "). Reviewer feedback: " + (reasons.join(", ") || "make it better") + (note ? ". Note: " + note : "") +
    ". Keep it consistent with the other sections; the whole post must stay within " + rangeText(S.length) + "." +
    '\nReply with only JSON: {"text":"...","source":"one of: ' + SRC_LABELS.join("; ") + '"}';
  ask(prompt, { cache: false }).then(function (r) {
    if (!r || !r.text) throw { code: "invalid_json" };
    done({ text: String(r.text).trim(), source: String(r.source || cur(s).source) });
  }, function (e) {
    if (e && e.code === "cancelled") { s.loading = false; render(); return; }
    if (isHardOff(e)) { var alt = demoSection(s.key, ctxObj(), s.versions.length % 2 === 1); done({ text: alt.text + (s.versions.length > 1 ? "" : ""), source: alt.source }); return; }
    s.loading = false; S.error = errCopy(e); render();
  });
}
function runChecks() {
  var flags = [], hasBad = false;
  S.sections.forEach(function (s, i) {
    var t = cur(s).text, m = t.match(/\[[^\]]+\]/g);
    if (m) m.forEach(function (p) { flags.push({ title: "Placeholder in " + s.name, detail: p + " is waiting for HP to confirm.", sec: i }); });
    var low = t.toLowerCase();
    OFF_LIMITS.forEach(function (w) { if (new RegExp("\\b" + w + "\\b").test(low)) { hasBad = true; flags.push({ title: "Off-limits topic in " + s.name, detail: 'Mentions "' + w + '". Mike\'s persona does not write about this.', sec: i, kind: "danger" }); } });
  });
  if (!hasBad) flags.push({ ok: true, title: "No off-limits topics found", detail: "Checked for pricing, memory supply, results and forecasts, and competitors." });
  var wc = words(assembled()), L = LENGTHS[S.length];
  if (wc < L.min * 0.85 || wc > L.max * 1.15) flags.push({ title: "Length is outside the range for this post type", detail: wc + " words; Mike's " + L.label.toLowerCase() + " posts run " + rangeText(S.length) + ". Fix to shorten or lengthen a section.", sec: null });
  else flags.push({ ok: true, title: "Length fits this post type", detail: wc + " words; his posts of this type run " + rangeText(S.length) + "." });
  S.flags = flags;
}

/* ---------- Events ---------- */
document.addEventListener("submit", function (e) {
  var f = e.target.getAttribute("data-f");
  if (!f) return;
  e.preventDefault();
  if (f === "login") go("home");
  if (f === "note") { var v = document.getElementById("noteIn").value.trim(); if (!v) { document.getElementById("noteIn").focus(); return; } S.account = null; S.note = v; S.fromNew = false; S.editNote = false; S.length = "pov"; S.link = ""; go("setup"); }
});
document.addEventListener("input", function (e) {
  var id = e.target.id;
  if (id === "dirNote") S.dirNote = e.target.value;
  if (id === "regenNote") S.regenNote = e.target.value;
  if (id === "noteNew" || id === "noteEdit") S.note = e.target.value;
  if (id === "linkIn") S.link = e.target.value.trim();
});
document.addEventListener("change", function (e) {
  if (e.target.id === "tagToggle") { S.useTags = e.target.checked; render(); return; }
  if (e.target.id === "accSel") { var id = e.target.value; S.account = ACCOUNTS.filter(function (a) { return a.id === id; })[0] || null; S.length = S.account ? S.account.suggest : "pov"; render(); }
});
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-a]");
  if (!el) return;
  var a = el.getAttribute("data-a"), i = +el.getAttribute("data-i");
  switch (a) {
    case "theme": var nt = isDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", nt); store("mp-theme", nt); render(); break;
    case "logout": S.drawer = null; go("login"); break;
    case "home": if (S.view !== "login") { if (ctl) ctl.abort(); go("home"); } break;
    case "drawer": S.drawer = el.getAttribute("data-d"); renderLayer(); break;
    case "closedrawer": S.drawer = null; renderLayer(); break;
    case "new": S.account = null; S.note = ""; S.fromNew = true; S.length = "pov"; S.link = ""; go("setup"); break;
    case "acc": S.account = ACCOUNTS.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0]; S.note = ""; S.fromNew = false; S.length = S.account.suggest; S.link = ""; go("setup"); break;
    case "editnote": S.editNote = !S.editNote; render(); break;
    case "len": S.length = el.getAttribute("data-k"); render(); break;
    case "continue":
      if (!S.account && !S.note.trim()) { toast("Pick an account or add a note first"); break; }
      S.dirReason = []; S.dirNote = ""; genDirections(false); break;
    case "stop": if (ctl) ctl.abort(); break;
    case "retry": S.error = ""; if (S.retry) S.retry(); break;
    case "usedemo": S.demo = true; S.error = ""; if (S.retry) S.retry(); break;
    case "pickdir": S.dir = i; render(); break;
    case "opendirpanel": S.showDirPanel = true; render(); break;
    case "closedirpanel": S.showDirPanel = false; render(); break;
    case "dirreason": var r = el.getAttribute("data-r"), k = S.dirReason.indexOf(r); if (k > -1) S.dirReason.splice(k, 1); else S.dirReason.push(r); render(); break;
    case "moredirs": S.firstDirs = S.firstDirs || S.directions; genDirections(true); break;
    case "backdirs": if (S.firstDirs) { S.directions = S.firstDirs; S.dirMore = false; S.dir = 0; render(); } break;
    case "usedir": if (!S.dirMore) S.firstDirs = S.directions; genPost(); break;
    case "redirect": go("direction"); break;
    case "approve": S.sections[i].approved = true; S.regenOpen = -1; S.editing = -1; S.current = S.sections.findIndex(function (s) { return !s.approved; }); if (S.current < 0) S.current = S.sections.length; render(); break;
    case "edit": S.editing = i; S.regenOpen = -1; render(); var ta = document.getElementById("edit-" + i); if (ta) ta.focus(); break;
    case "canceledit": S.editing = -1; render(); break;
    case "saveedit":
      var t = document.getElementById("edit-" + i).value.trim(); if (!t) { toast("A section can't be empty"); break; }
      var s = S.sections[i]; s.versions.push({ text: t, source: cur(s).source + " (edited)" }); s.v = s.versions.length - 1;
      if (s.approved && S.sections.slice(i + 1).some(function (x) { return x.approved; })) S.warnLater = true;
      S.editing = -1; render(); break;
    case "regen": S.regenOpen = i; S.regenReasons = []; S.regenNote = ""; render(); break;
    case "closeregen": S.regenOpen = -1; render(); break;
    case "rreason": var rr = el.getAttribute("data-r"), kk = S.regenReasons.indexOf(rr); if (kk > -1) S.regenReasons.splice(kk, 1); else S.regenReasons.push(rr); render(); break;
    case "doregen": regenSection(i); break;
    case "vprev": S.sections[i].v = Math.max(0, S.sections[i].v - 1); render(); break;
    case "vnext": S.sections[i].v = Math.min(S.sections[i].versions.length - 1, S.sections[i].v + 1); render(); break;
    case "preview": runChecks(); go("check"); break;
    case "fix": var f = S.flags[i]; if (f.sec != null) { var sx = S.sections[f.sec]; sx.approved = false; S.current = f.sec; S.editing = f.sec; } go("build"); break;
    case "keep": S.flags[i].keeping = true; render(); break;
    case "cancelkeep": S.flags[i].keeping = false; render(); break;
    case "savekeep": var why = document.getElementById("keep-" + i).value.trim(); if (!why) { toast("Add a short reason to keep it"); break; } S.flags[i].reason = why; S.flags[i].resolved = true; S.flags[i].keeping = false; render(); break;
    case "unkeep": S.flags[i].resolved = false; render(); break;
    case "markfinal":
      var text = finalText(), srcs = [];
      S.sections.forEach(function (s) { var x = (cur(s).source || "").replace(" (edited)", ""); if (x && srcs.indexOf(x) < 0) srcs.push(x); });
      S.final = { text: text, sources: srcs, length: S.length };
      var d = new Date();
      history = history.filter(function (h) { return !h.example; });
      history.unshift({ date: d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }), account: S.account ? S.account.short : "From a note", color: S.account ? S.account.color : "#5B6B80", topic: topicOf(), text: text, length: S.length, sources: srcs });
      history = history.slice(0, 30); store("mp-history-v2", history); go("final"); break;
    case "copy": copyText(S.final.text); break;
    case "backbuild": go("build"); break;
    case "startnew": go("home"); break;
    case "hopen": var h = history[i]; S.final = { text: h.text, sources: h.sources || [], length: h.length, fromHistory: true }; go("final"); break;
    case "hcopy": copyText(history[i].text); break;
  }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.drawer) { S.drawer = null; renderLayer(); } });
function copyText(t) {
  var ok = function () { toast("Copied to clipboard"); };
  try {
    navigator.clipboard.writeText(t).then(ok, function () { fallbackCopy(t); });
  } catch (e) { fallbackCopy(t); }
}
function fallbackCopy(t) {
  var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.left = "-9999px"; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Copied to clipboard"); } catch (e) { toast("Select the text and copy it"); }
  document.body.removeChild(ta);
}
window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").addEventListener && window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

render();
})();
</script>

</body></html>
